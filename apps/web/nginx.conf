# Production equivalent of the Vite dev proxy: one origin for the browser,
# so the httpOnly session cookie works without CORS.
server {
  listen 80;
  root /usr/share/nginx/html;

  # /api/tickets -> http://api:3000/tickets
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO: HTTP upgrade to WebSocket must be forwarded explicitly.
  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths (/tickets/123) serve index.html, React Router takes over.
  location / {
    try_files $uri /index.html;
  }
}
